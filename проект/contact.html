  <div class="container">
    <section>
  <h2>Запись на уроки</h2>

  <form class="signup-form" action="#" method="post">
    <label for="name">Ваше имя</label>
    <input type="text" id="name" name="name" placeholder="Введите имя" required>

    <label for="age">Возраст</label>
    <input type="number" id="age" name="age" placeholder="Введите возраст" min="7" max="18" required>

    <label>Умеете играть на гитаре?</label>
    <div class="radio-group">
      <label><input type="radio" name="skill" value="yes" required> Да</label>
      <label><input type="radio" name="skill" value="no"> Нет</label>
    </div>

    <label for="level">Уровень</label>
    <select id="level" name="level" required>
      <option value="">Выберите вариант</option>
      <option value="beginner">Не умею играть</option>
      <option value="basic">Немного умею</option>
      <option value="advanced">Уже играю хорошо</option>
    </select>

    <label for="comment">Комментарий</label>
    <textarea id="comment" name="comment" rows="5" placeholder="Напишите, что хотите изучать..."></textarea>

    <button type="submit">Отправить заявку</button>
  </form>

  <div class="contact-item">📱 <a href="tel:+79876543210">+7 (987) 654-32-10</a></div>
  <div class="contact-item">✉️ <a href="mailto:klub.gitaristov@mail.ru">klub.gitaristov@mail.ru</a></div>
  <div class="contact-item">🌐 <a href="https://vk.com/young_guitarists" target="_blank">VK группа клуба</a></div>
  <p style="margin-top: 20px; font-size: 0.9em;">г. Альметьевск, ул. Музыкальная, 10</p>

<script>
  (function() {
    const form = document.getElementById('signupForm');

    // Функция красивого уведомления
    function showThanksMessage() {
      // Удаляем предыдущее уведомление, если есть
      const oldToast = document.querySelector('.toast-message');
      if (oldToast) oldToast.remove();

      // Создаём плашку
      const toast = document.createElement('div');
      toast.className = 'toast-message';
      toast.innerHTML = '🎸 Спасибо за заявку! 🎸<br>Мы свяжемся с вами в ближайшее время.';
      // Для мобильных перенос строки смотрится лучше
      if (window.innerWidth < 560) {
        toast.style.flexDirection = 'column';
        toast.style.textAlign = 'center';
      }
      document.body.appendChild(toast);

      // Автоматическое исчезновение через 4 секунды
      setTimeout(() => {
        if (toast && toast.parentNode) toast.remove();
      }, 4000);
    }

    // Обработчик отправки формы
    form.addEventListener('submit', function(event) {
      event.preventDefault(); // Отключаем перезагрузку

      // Валидация HTML5 (required, min, max)
      if (form.checkValidity()) {
        // Показываем благодарность
        showThanksMessage();

        // Очищаем форму (приятный момент, можно оставить поля пустыми)
        form.reset();

        // Дополнительно можно сбросить радио-кнопки и select
        // Встроенный reset уже всё очищает, но select останется с первым пустым option – это хорошо
        // Также сбрасываются все значения, включая textarea
      } else {
        // Если форма не заполнена, браузер покажет стандартные подсказки
        form.reportValidity();
      }
    });
  })();
</script>
</section>
